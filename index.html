<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Simulator</title>
    <link rel="stylesheet" href="file.css">
</head>
<body>
    <div id="screen">

    </div>
<script>
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    let blorbStorage = [];
    let numOfBlorbs = 0;
    let numOfGeneticVariations = 0;
    let blorbFeatures = ["bigeyed", "medeyed", "smalleyed", "tailed", "notail", "bigeared", "medeared", "smalleared"];
    let foodPref = ["plant", "landmeat", "fish", "seagrass"];
    let colorBlorb = ["purple", "blue", "yellow", "green", "red", "orange"]

    /* Template for blorb object
    blorb {
        id: 1,
        parentBlorb: 1,
        specialtyFeatures: ["smalleyed", "tailed"],
        width: 50,
        height: 50,
        speed: 1,
        hunger: 3,
        thirst: 2,
        hungerBarMax: 4,
        thirstBarMax: 4,
        color: "purple",
        reproductionRequirement: [4, 4],
        foodPreferences: "plant",
        sexualPreferences: ["tailed", "bigeyed"],
    }
    */

    function random(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function run(numOfFounders) {
        for (let i = 0; i < numOfFounders; i++) {
            makeFoundingBlorbs(i);
        }
    }

    function makeFoundingBlorbs(blorbNum) {
        let tempID = blorbNum;
        let parentBlorb = blorbNum;
        let tempSpecialityLength = random(1,3)
        let specialtyFeatures = Array.from({ length: tempSpecialityLength }, () => blorbFeatures[random(0, blorbFeatures.length)]);
        let foodPreference = foodPref[random(0, foodPref.length)];
        let tempWidth = random(25, 100);
        let tempHeight = random(25, 100);
        let maxHungerTemp = random(3,6);
        let maxThirstTemp = random(3,6);
        let tempSpeed = random(1,5)
        let reproductionRequirementTemp = [random(1,6), random(1,6)];
        let sexualPreferences = Array.from({ length: tempSpecialityLength }, () => blorbFeatures[random(0, blorbFeatures.length)]);
        
        let blorbObjectGeneration = {
            id: tempID,
            parentBlorb: parentBlorb,
            specialtyFeatures: specialtyFeatures,
            width: tempWidth,
            height: tempHeight,
            speed: tempSpeed,
            hunger: random(2,6),
            thirst: random(2,6),
            maxHunger: maxHungerTemp,
            maxThirst: maxThirstTemp,
            color: colorBlorb[random(0, colorBlorb.length)],
            reproductionRequirement: reproductionRequirementTemp,
            foodPreference: foodPreference,
            sexualPreferences: sexualPreferences,
        }

        blorbStorage.push(blorbObjectGeneration);
    }
    
    function makeNewBlorb(parentA,parentB) {
        let tempID = Math.floor(Math.sqrt(((parentA.id + parentB.id) * 10) + random(-50,50))) * random(10,150);
        let parentBlorb = parentA.id;
        let specialtyFeatures;
        if (getGeneticTrait() === "parentA") {
            specialtyFeatures = parentA.specialtyFeatures;
        } else if (getGeneticTrait() === "parentB") {
            specialtyFeatures = parentB.specialtyFeatures;
        } else {
            let tempSpecialityLength = random(1,3);
            specialtyFeatures = Array.from({ length: tempSpecialityLength }, () => blorbFeatures[random(0, blorbFeatures.length)]);
        }
        let foodPreference;
        if (getGeneticTrait() === "parentA") {
            foodPreference = parentA.foodPreference;
        } else if (getGeneticTrait() === "parentB") {
            foodPreference = parentB.foodPreference;
        } else {
            foodPreference = foodPref[random(0, foodPref.length)];
        }      
        let tempWidth; 
        if (getGeneticTrait() === "parentA") {
            tempWidth = parentA.width;
        } else if (getGeneticTrait() === "parentB") {
            tempWidth = parentB.width;
        } else {
            tempWidth = random(25,100)
        } 
        let tempHeight;
        if (getGeneticTrait() === "parentA") {
            tempHeight = parentA.height;
        } else if (getGeneticTrait() === "parentB") {
            tempHeight = parentA.height;
        } else {
            tempHeight = random(25,100)
        } 
        let maxHungerTemp;
        if (getGeneticTrait() === "parentA") {
            maxHungerTemp = parentA.maxHunger;
        } else if (getGeneticTrait() === "parentB") {
            maxHungerTemp = parentB.maxHunger;
        } else {
            maxHungerTemp = random(2,8)
        }    
        let maxThirstTemp;
        if (getGeneticTrait() === "parentA") {
            maxThirstTemp = parentA.maxThirst;
        } else if (getGeneticTrait() === "parentB") {
            maxThirstTemp = parentB.maxThirst;
        } else {
            maxThirstTemp = random(2,8)
        }         
        let tempSpeed;
        if (getGeneticTrait() === "parentA") {
            tempSpeed = parentA.speed;
        } else if (getGeneticTrait() === "parentB") {
            tempSpeed = parentB.speed;
        } else {
            tempSpeed = random(1,8)
        }         
        let reproductionRequirementTemp;
        if (getGeneticTrait() === "parentA") {
            reproductionRequirementTemp = parentA.reproductionRequirement;
        } else if (getGeneticTrait() === "parentB") {
            reproductionRequirementTemp = parentB.reproductionRequirement;
        } else {
            reproductionRequirementTemp = [random(1,6), random(1,6)];
        } 
        let sexualPreferences;
        if (getGeneticTrait() === "parentA") {
            sexualPreferences = parentA.sexualPreferences;
        } else if (getGeneticTrait() === "parentB") {
            sexualPreferences = parentB.sexualPreferences;
        } else {
            let tempSpecialityLength = random(1,3);
            sexualPreferences = Array.from({ length: tempSpecialityLength }, () => blorbFeatures[random(0, blorbFeatures.length)]); 
        }        
        let colorTemp;
        if (getGeneticTrait() === "parentA") {
            colorTemp = parentA.color;
        } else if (getGeneticTrait() === "parentB") {
            colorTemp = parentB.color;
        } else {
            colorTemp = colorBlorb[random(0, colorBlorb.length)];
        }

        let blorbObjectGeneration = {
            id: tempID,
            parentBlorb: parentBlorb,
            specialtyFeatures: specialtyFeatures,
            width: tempWidth,
            height: tempHeight,
            speed: tempSpeed,
            hunger: random(2,6),
            thirst: random(2,6),
            maxHunger: maxHungerTemp,
            maxThirst: maxThirstTemp,
            color: colorTemp,
            reproductionRequirement: reproductionRequirementTemp,
            foodPreference: foodPreference,
            sexualPreferences: sexualPreferences,
        }

        blorbStorage.push(blorbObjectGeneration);
    }

    run(10);
    let ONEPARENT = blorbStorage[random(0, blorbStorage.length - 1)];
    let TWOPARENT = blorbStorage[random(0, blorbStorage.length - 1)];
    makeNewBlorb(ONEPARENT, TWOPARENT)
    console.log(blorbStorage)


    function getGeneticTrait() {
        let randomNumber = random(0,100);
        if (randomNumber <= 45) {
            return "parentA"
        } else if (randomNumber <= 100 && randomNumber >= 51) {
            return "parentB"
        } else {
            return "mutate"
        }
    }


</script>
</body>
</html>
